[project]
name = "agy-switch"
version = "0.1.0"
description = "Switch between Antigravity CLI (agy) accounts"
readme = "README.md"
authors = [
    { name = "renatormc", email = "renatomartinsrmc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.scripts]
agy-switch = "agy_switch:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
