[project]
name = "agy-switch"
version = "0.1.0"
description = "Switch between Antigravity CLI (agy) accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "renatormc", email = "renatomartinsrmc@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["agy", "antigravity", "cli", "accounts", "profiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/renatormc/agy-switcher"
Repository = "https://github.com/renatormc/agy-switcher"
Issues = "https://github.com/renatormc/agy-switcher/issues"

[project.scripts]
agy-switch = "agy_switch:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
